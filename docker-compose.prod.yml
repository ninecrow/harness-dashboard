version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: harness-nginx
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - harness-network
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: harness-api
    expose:
      - "8000"
    volumes:
      - ~/.hermes/logs:/app/logs:ro
      - ~/.hermes/kanban.db:/app/kanban.db:ro
      - ~/.hermes/config.yaml:/app/config.yaml:ro
      - ~/.hermes/skills:/app/skills:ro
    environment:
      - HERMES_LOG_PATH=/app/logs
      - HERMES_KANBAN_DB=/app/kanban.db
      - HERMES_CONFIG_PATH=/app/config.yaml
      - HERMES_SKILLS_PATH=/app/skills
    networks:
      - harness-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: harness-dashboard
    expose:
      - "3000"
    networks:
      - harness-network
    restart: unless-stopped

networks:
  harness-network:
    driver: bridge
