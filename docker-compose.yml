version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: harness-api
    ports:
      - "8000:8000"
    volumes:
      - ~/.hermes/logs:/app/logs:ro
      - ~/.hermes/kanban.db:/app/data/kanban.db:ro
      - ~/.hermes/config.yaml:/app/data/config.yaml:ro
      - ~/.hermes/skills:/app/data/skills:ro
      - ~/.hermes/memories:/app/data/memories:ro
      - ./api/app:/app/app:ro
    environment:
      - HERMES_LOG_PATH=/app/logs
      - HERMES_DATA_PATH=/app/data
      - DATABASE_URL=sqlite:///app/data/kanban.db
      - CORS_ORIGINS=http://localhost:3000
      - REFRESH_INTERVAL=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: harness-dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_REFRESH_INTERVAL=30000
      - REACT_APP_VERSION=1.0.0
    depends_on:
      - api
    restart: unless-stopped

  # 可选：Nginx 反向代理（生产环境）
